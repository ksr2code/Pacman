[DEPENDENCIES]
ignoreDirs = [".venv", "**/.venv", "butler", "test", "build", ".git", ".pytest_cache", ".mypy_cache", ".ruff_cache", "dist-info"]
ignoreFiles = ["Makefile", "README.md", "pyproject.toml", "uv.lock", "*.egg-info"]
# Include local packages to avoid runtime pip install
include = ["src/packages"]

