[project]
name = "pac-man"
version = "0.3.0"
description = "Pacman 42 School project"
readme = "README.md"
authors = [
    { name = "Kaisar Smailov", email = "ksmailov@student.42heilbronn.de" },
    { name = "Andrei-Olimpiu Balcu", email = "abalcu@student.42heilbronn.de" }
]
requires-python = ">=3.12"
dependencies = [
    "flake8",
    "mypy",
    "pytest>=9.0.2",
    "pygame-ce",
    "mazegenerator",
]

[tool.uv.sources]
mazegenerator = { path = "packages/mazegenerator-00001-py3-none-any.whl" }

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
exclude = ["pac-man\\.py$", "src/build/", "\\.venv/"]

[[tool.mypy.overrides]]
module = "mazegenerator.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]

