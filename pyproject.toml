[project]
name = "pac-man"
version = "0.2.0"
description = "Pacman 42 School project"
readme = "README.md"
authors = [
    { name = "Kaisar Smailov", email = "ksmailov@student.42heilbronn.de" },
    { name = "Andrei-Olimpiu Balcu", email = "abalcu@student.42heilbronn.de" }
]
requires-python = ">=3.12"
dependencies = [
    "mazegenerator",
    "pygame-ce",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "mypy",
    "pytest>=9.0.2",
]

[tool.uv.sources]
mazegenerator = { path = "src/packages/mazegenerator-00001-py3-none-any.whl" }

[project.scripts]
pac-man = "pac_man:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"
